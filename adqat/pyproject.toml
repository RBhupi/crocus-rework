[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adqat"
version = "0.1.4"
description = "Automated Data Quality Assessment for Time-Series"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.5,<1.6",
  "netCDF4>=1.7,<2",
  "numpy>=1.26,<2",
  "pointblank[pl]>=0.27,<0.28",
  "polars>=1.33,<2",
  "pyarrow>=20,<26",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "import-linter>=2.3,<3",
  "mypy>=1.18,<2",
  "pyarrow-stubs>=20,<26",
  "pytest>=8,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
adqat = "adqat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  "ignore:numpy.ndarray size changed, may indicate binary incompatibility:RuntimeWarning",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adqat"]

[[tool.mypy.overrides]]
module = ["netCDF4", "netCDF4.*", "pointblank", "pointblank.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["adqat"]

[[tool.importlinter.contracts]]
name = "Source and Pointblank do not persist"
type = "forbidden"
source_modules = ["adqat.source", "adqat.pointblank"]
forbidden_modules = ["adqat.store"]

[[tool.importlinter.contracts]]
name = "Compiler is independent of Pointblank"
type = "forbidden"
source_modules = ["adqat.compile"]
forbidden_modules = ["adqat.pointblank"]
