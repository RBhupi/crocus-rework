# CROCUS PILOT RULES -- NOT YET SCIENTIFICALLY APPROVED FOR PUBLICATION.
# Instrument limits come from the cited Vaisala documentation. Broader physical
# limits are screening bounds. Review findings on real data before approval.
schema_version: 1

metadata:
  status: pilot
  description: >-
    Reusable WXT536 and AQT530 QA/QC rules for the W08D two-day A2Z pilot.
    These are engineering candidates, not approved CROCUS science rules.
  references:
    wxt536: https://docs.vaisala.com/r/M211840EN-G/en-US/GUID-14C989C0-8199-42C7-AE98-6EE7CA6D9148
    wxt536_supervisor: https://docs.vaisala.com/r/M211840EN-G/en-US/GUID-314E0A6B-ED3E-4B09-BDD0-1864CF924817/GUID-79A2B4EC-8207-4B2A-B823-31218EDABB2F/GUID-E35BAE8B-4D3C-47CC-B55C-9C1CCBBD351E
    aqt530: https://docs.vaisala.com/api/khub/documents/fssQiSU03EZNylxjoIYc7A/content

flags:
  missing_value:
    bit: 0
    description: Observation exists but is null, NaN, or a declared source sentinel.
  missing_sample:
    bit: 1
    description: Expected observation is absent; cadence QC remains disabled in this pilot.
  physical_range:
    bit: 2
    description: Value is outside a broad physical plausibility screen.
  instrument_range:
    bit: 3
    description: Value is outside the documented or explicitly provisional instrument range.

profiles:
  crocus_wxt536_pilot:
    # No cadence is asserted. The WXT interval must be confirmed from deployment
    # configuration before missing-sample or coverage checks are enabled.
    variables:
      air_temperature:
        column: value_float64
        where: {measurement: wxt.env.temp, field: value, value_type: float64}
        units: degree_Celsius
        missing_values: [-9999.9]
        checks:
          - {id: wxt_air_temperature_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_air_temperature_physical
            method: col_vals_between
            flag: physical_range
            args: {left: -90, right: 70, inclusive: [true, true]}
          - id: wxt_air_temperature_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: -52, right: 60, inclusive: [true, true]}

      relative_humidity:
        column: value_float64
        where: {measurement: wxt.env.humidity, field: value, value_type: float64}
        units: percent
        missing_values: [-9999.9]
        checks:
          - {id: wxt_relative_humidity_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_relative_humidity_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 100, inclusive: [true, true]}

      air_pressure:
        column: value_float64
        where: {measurement: wxt.env.pressure, field: value, value_type: float64}
        units: hPa
        missing_values: [-9999.9]
        checks:
          - {id: wxt_air_pressure_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_air_pressure_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 300, right: 1200, inclusive: [true, true]}
          - id: wxt_air_pressure_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 500, right: 1100, inclusive: [true, true]}

      wind_speed:
        column: value_float64
        where: {measurement: wxt.wind.speed, field: value, value_type: float64}
        units: m s-1
        missing_values: [-9999.9]
        checks:
          - {id: wxt_wind_speed_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_wind_speed_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 150, inclusive: [true, true]}
          - id: wxt_wind_speed_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 75, inclusive: [true, true]}

      wind_direction:
        column: value_float64
        where: {measurement: wxt.wind.direction, field: value, value_type: float64}
        units: degree
        missing_values: [-9999.9]
        checks:
          - {id: wxt_wind_direction_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_wind_direction_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 360, inclusive: [true, true]}

      rain_accumulation:
        column: value_float64
        where: {measurement: wxt.rain.accumulation, field: value, value_type: float64}
        units: mm
        missing_values: [-9999.9]
        checks:
          - {id: wxt_rain_accumulation_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_rain_accumulation_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 65535, inclusive: [true, true]}

      hail_accumulation:
        column: value_float64
        where: {measurement: wxt.hail.accumulation, field: value, value_type: float64}
        units: hits cm-2
        missing_values: [-9999.9]
        checks:
          - {id: wxt_hail_accumulation_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_hail_accumulation_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 65535, inclusive: [true, true]}

      heater_temperature:
        column: value_float64
        where: {measurement: wxt.heater.temp, field: value, value_type: float64}
        units: degree_Celsius
        missing_values: [-9999.9]
        checks:
          - {id: wxt_heater_temperature_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_heater_temperature_physical
            method: col_vals_between
            flag: physical_range
            args: {left: -80, right: 100, inclusive: [true, true]}

      heater_voltage:
        column: value_float64
        where: {measurement: wxt.heater.volt, field: value, value_type: float64}
        units: V
        missing_values: [-9999.9]
        checks:
          - {id: wxt_heater_voltage_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_heater_voltage_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 31.2, inclusive: [true, true]}

      heater_status:
        column: value_float64
        where: {measurement: wxt.heater.status, field: value, value_type: float64}
        units: "1"
        missing_values: [-9999.9]
        checks:
          - {id: wxt_heater_status_missing, method: col_vals_not_null, flag: missing_value}

      supply_voltage:
        column: value_float64
        where: {measurement: wxt.voltage.supply, field: value, value_type: float64}
        units: V
        missing_values: [-9999.9]
        checks:
          - {id: wxt_supply_voltage_missing, method: col_vals_not_null, flag: missing_value}
          - id: wxt_supply_voltage_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 31.2, inclusive: [true, true]}
          - id: wxt_supply_voltage_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 5.4, right: 31.2, inclusive: [true, true]}

  crocus_aqt530_pilot:
    # AQT outputs have variable-dependent update intervals, so a single profile
    # cadence would be incorrect. Cadence metadata is intentionally omitted.
    variables:
      air_temperature:
        column: value_float64
        where: {measurement: aqt.env.temp, field: value, value_type: float64}
        units: degree_Celsius
        missing_values: [-9999.9]
        checks:
          - {id: aqt_air_temperature_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_air_temperature_physical
            method: col_vals_between
            flag: physical_range
            args: {left: -90, right: 70, inclusive: [true, true]}
          - id: aqt_air_temperature_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: -30, right: 40, inclusive: [true, true]}

      relative_humidity:
        column: value_float64
        where: {measurement: aqt.env.humidity, field: value, value_type: float64}
        units: percent
        missing_values: [-9999.9]
        checks:
          - {id: aqt_relative_humidity_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_relative_humidity_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 100, inclusive: [true, true]}

      air_pressure:
        column: value_float64
        where: {measurement: aqt.env.pressure, field: value, value_type: float64}
        units: hPa
        missing_values: [-9999.9]
        checks:
          - {id: aqt_air_pressure_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_air_pressure_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 300, right: 1200, inclusive: [true, true]}
          - id: aqt_air_pressure_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 800, right: 1150, inclusive: [true, true]}

      carbon_monoxide:
        column: value_float64
        where: {measurement: aqt.gas.co, field: value, value_type: float64}
        units: ppm
        missing_values: [-9999.9]
        checks:
          - {id: aqt_carbon_monoxide_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_carbon_monoxide_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 1000, inclusive: [true, true]}
          - id: aqt_carbon_monoxide_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 10, inclusive: [true, true]}

      nitric_oxide:
        column: value_float64
        where: {measurement: aqt.gas.no, field: value, value_type: float64}
        units: ppm
        missing_values: [-9999.9]
        checks:
          - {id: aqt_nitric_oxide_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_nitric_oxide_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100, inclusive: [true, true]}
          - id: aqt_nitric_oxide_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 2, inclusive: [true, true]}

      nitrogen_dioxide:
        column: value_float64
        where: {measurement: aqt.gas.no2, field: value, value_type: float64}
        units: ppm
        missing_values: [-9999.9]
        checks:
          - {id: aqt_nitrogen_dioxide_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_nitrogen_dioxide_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100, inclusive: [true, true]}
          - id: aqt_nitrogen_dioxide_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 2, inclusive: [true, true]}

      ozone:
        column: value_float64
        where: {measurement: aqt.gas.ozone, field: value, value_type: float64}
        units: ppm
        missing_values: [-9999.9]
        checks:
          - {id: aqt_ozone_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_ozone_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100, inclusive: [true, true]}
          - id: aqt_ozone_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 2, inclusive: [true, true]}

      instrument_datetime:
        column: value_string
        data_type: string
        where: {measurement: aqt.house.datetime, field: value, value_type: string}
        units: UTC
        missing_strings: ["-9999.9", ""]
        checks:
          - {id: aqt_instrument_datetime_missing, method: col_vals_not_null, flag: missing_value}

      instrument_uptime:
        column: value_float64
        where: {measurement: aqt.house.uptime, field: value, value_type: float64}
        units: s
        missing_values: [-9999.9]
        checks:
          - {id: aqt_instrument_uptime_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_instrument_uptime_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 4294967295, inclusive: [true, true]}

      particulate_matter_pm1:
        column: value_float64
        where: {measurement: aqt.particle.pm1, field: value, value_type: float64}
        units: ug m-3
        missing_values: [-9999.9]
        checks:
          - {id: aqt_pm1_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_pm1_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100000, inclusive: [true, true]}
          - id: aqt_pm1_provisional_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 1000, inclusive: [true, true]}

      particulate_matter_pm2_5:
        column: value_float64
        where: {measurement: aqt.particle.pm2.5, field: value, value_type: float64}
        units: ug m-3
        missing_values: [-9999.9]
        checks:
          - {id: aqt_pm2_5_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_pm2_5_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100000, inclusive: [true, true]}
          - id: aqt_pm2_5_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 1000, inclusive: [true, true]}

      particulate_matter_pm10:
        column: value_float64
        where: {measurement: aqt.particle.pm10, field: value, value_type: float64}
        units: ug m-3
        missing_values: [-9999.9]
        checks:
          - {id: aqt_pm10_missing, method: col_vals_not_null, flag: missing_value}
          - id: aqt_pm10_physical
            method: col_vals_between
            flag: physical_range
            args: {left: 0, right: 100000, inclusive: [true, true]}
          - id: aqt_pm10_instrument
            method: col_vals_between
            flag: instrument_range
            args: {left: 0, right: 2500, inclusive: [true, true]}

pipelines:
  basic_qc:
    stages:
      - {id: basic, engine: pointblank}
