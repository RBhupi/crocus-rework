# Vaisala AQT530 profile -- Stage 1 statistical reduction.
#
# Stage 1 performs no QA/QC. This profile carries only what is needed to select a
# variable's rows out of the long-format raw table, name its output column, and choose
# its aggregation method. Physical/instrument ranges and QC thresholds are deliberately
# absent: they belong to a later stage that does not exist yet.
#
# aggregation:
#   mean -> AVG, plus raw_min / raw_max / raw_std
#   last -> latest value in the bucket by observation timestamp (no min/max/std)

schema_version: 2
sensor: vaisala-aqt530
instrument_label: aqt530

variables:
  air_temperature:
    measurement: aqt.env.temp
    field: value
    value_type: float64
    units: degree_Celsius
    aggregation: mean

  relative_humidity:
    measurement: aqt.env.humidity
    field: value
    value_type: float64
    units: percent
    aggregation: mean

  air_pressure:
    measurement: aqt.env.pressure
    field: value
    value_type: float64
    units: hPa
    aggregation: mean

  carbon_monoxide:
    measurement: aqt.gas.co
    field: value
    value_type: float64
    units: ppm
    aggregation: mean

  nitric_oxide:
    measurement: aqt.gas.no
    field: value
    value_type: float64
    units: ppm
    aggregation: mean

  nitrogen_dioxide:
    measurement: aqt.gas.no2
    field: value
    value_type: float64
    units: ppm
    aggregation: mean

  ozone:
    measurement: aqt.gas.ozone
    field: value
    value_type: float64
    units: ppm
    aggregation: mean

  particulate_matter_pm1:
    measurement: aqt.particle.pm1
    field: value
    value_type: float64
    units: ug m-3
    aggregation: mean

  particulate_matter_pm2_5:
    measurement: aqt.particle.pm2.5
    field: value
    value_type: float64
    units: ug m-3
    aggregation: mean

  particulate_matter_pm10:
    measurement: aqt.particle.pm10
    field: value
    value_type: float64
    units: ug m-3
    aggregation: mean

  # Monotonic counter: the bucket mean is meaningless, and so are min/max/std.
  instrument_uptime:
    measurement: aqt.house.uptime
    field: value
    value_type: float64
    units: s
    aggregation: last

  instrument_datetime:
    measurement: aqt.house.datetime
    field: value
    value_type: string
    units: "1"
    aggregation: last
    data_type: string
    missing_strings: ["-9999.9", ""]
