[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crocus-qc"
version = "0.2.1"
description = "10-second statistical reduction of CROCUS high-frequency observations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyarrow>=20",  # test fixtures only: builds raw Parquet with the exact ingest Arrow types
  "ruff>=0.13,<1",
]

[project.scripts]
crocus-qc = "crocus_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crocus_qc = ["profiles/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
