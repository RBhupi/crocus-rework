[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crocus-raw"
version = "0.5.0"
description = "Selective streaming of InfluxDB data to sensor/VSN/instrument/day Parquet datasets"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=20,<22",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
crocus-raw = "crocus_raw.cli:main"
crocus-inventory = "crocus_raw.inventory_cli:main"
crocus-export = "crocus_raw.export_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
